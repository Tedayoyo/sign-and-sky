{% extends "base.html" %}
{% block content %}

<div class="wrap" data-user="{{ user.name or user.sub }}">
  <h1>SIGN &amp; SKY</h1>
  <div class="lang"><button id="l-en" class="on">English</button><button id="l-am">አማርኛ</button></div>
  <p class="sub" id="t-sub"></p>

  <div class="card">
    <label for="loc" id="t-where"></label>
    <select id="loc">
      <option value="wol"></option><option value="tel"></option><option value="har"></option>
    </select>
    <div class="row">
      <button class="mic" id="mic" title="Speak" aria-label="Speak">🎤</button>
      <input type="text" id="said" >
      <button class="go" id="go"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div id="out">
    <div class="step" id="s1"><h3 id="h1"></h3><div id="heard"></div></div>
    <div class="step" id="s2"><h3 id="h2"></h3><div class="kv" id="und"></div></div>
    <div class="step" id="s3"><h3 id="h3"></h3><div id="test"></div><div class="mono" id="srcline"></div></div>
    <div class="step" id="s4"><h3 id="h4"></h3><div class="voice" id="adv"></div>
      <div class="act"><button id="rep"></button><button id="mute"></button></div></div>
  </div>

  <div class="foot" id="t-foot"></div>
  <div class="foot" id="signed"></div>
</div>


<script type="module" src="/sky.js"></script>
{% endblock %}
